<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskflow</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="m-3">
    <h1 class="border-bottom mb-3">Taskflow</h1>  
	
	<form id="task-form" class="mb-3">
        <div class="row mb-3">
            <label for="title" class="col-sm-2 col-form-label">Titre</label>
            <div class="col-sm-10">
                <input id="title" type="text" required class="form-control" placeholder="Titre de la tâche">
            </div>
        </div>

        <div class="row mb-3">
            <label for="priority" class="col-sm-2 col-form-label">Priorité</label>
            <div class="col-sm-10">
                <select id="priority" class="form-select">
                    <option value="low">Basse</option>
                    <option value="normal" selected>Normale</option>
                    <option value="high">Haute</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="offset-sm-2 col-sm-10">
                <button type="submit" class="btn btn-primary">Ajouter</button>
            </div>
        </div>
    </form>

    <section class="border-top pt-3 mb-3" aria-labelledby="filters-title">
        <h2 id="filters-title" class="h4 mb-3">Filtres</h2>
        <div class="row g-3">
            <div class="col-md-3">
                <label for="filter-search" class="form-label">Recherche</label>
                <input id="filter-search" type="search" class="form-control" placeholder="Rechercher...">
            </div>
            <div class="col-md-3">
                <label for="filter-status" class="form-label">Statut</label>
                <select id="filter-status" class="form-select">
                    <option value="">Tous</option>
                    <option value="todo">À faire</option>
                    <option value="doing">En cours</option>
                    <option value="done">Terminée</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="filter-priority" class="form-label">Priorité</label>
                <select id="filter-priority" class="form-select">
                    <option value="">Toutes</option>
                    <option value="low">Faible</option>
                    <option value="normal">Normale</option>
                    <option value="high">Haute</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="filter-assignee" class="form-label">Utilisateur</label>
                <select id="filter-assignee" class="form-select">
                    <option value="">Tous</option>
                </select>
            </div>
        </div>
    </section>
    <ul id="task-list"></ul>
    
	<!-- /!\ Bootstrap avant TypeScript -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="../dist/index.js"></script>         
</body>
</html>
